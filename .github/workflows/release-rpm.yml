name: release-rpm

# Builds, packages and install-tests on every pull request and push to rewrite,
# publishing nothing (10 §1): a change that breaks a package is red on its own
# pull request. On main it runs after the gate, `test`, passes, so a red build
# never reaches the nightly URL. workflow_run fires only from the default
# branch's copy of this file.
on:
  push:
    branches: [rewrite]
  pull_request:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-rpm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rpm:
    # 10 §2: only a gate run for a push to this repository releases. A fork
    # pull request's gate run carries the fork's branch name as head_branch.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:44"]
        arch: [amd64, arm64]
        # `arch` has to be a matrix key: an include entry sharing no key with
        # the matrix is merged into every combination instead of selecting one.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_NUMBER: ${{ github.run_number }}
      PUBLISH: >-
        ${{ (github.event_name == 'workflow_run'
             && github.event.workflow_run.event == 'push'
             && github.event.workflow_run.head_repository.full_name == github.repository
             && github.event.workflow_run.head_branch == 'main')
            || (github.event_name == 'workflow_dispatch'
                && github.ref == 'refs/heads/main') }}
    steps:
      - name: Install system dependencies
        # fuse3, not fuse: libfuse3 mounts through the setuid fusermount3,
        # which only fuse3 provides. gmp-devel is for mirage-crypto-pk, and gh
        # for the publish step. dbus-devel is the tray's; cmake, Qt 6 and KDE
        # Frameworks 6 are the Dolphin plugin's; the FFmpeg libraries make share
        # preview images.
        run: |
          dnf install -y \
            opam gcc gcc-c++ make m4 pkgconf-pkg-config git curl unzip rsync tar gzip \
            rpm-build systemd-rpm-macros gh binutils \
            fuse3-devel fuse3 openssl-devel gmp-devel \
            libavcodec-free-devel libavformat-free-devel libavutil-free-devel libswscale-free-devel \
            dbus-devel cmake extra-cmake-modules qt6-qtbase-devel \
            kf6-kcoreaddons-devel kf6-kio-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # linux/build.sh builds a whole opam switch, which is nearly all of this
      # job. A hit is fast rather than stale: build.sh updates and upgrades
      # before it installs.
      - name: Restore the opam root
        id: opam-root
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: opam-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('*.opam', 'linux/build.sh') }}

      - name: Build
        run: ./linux/build.sh
        env:
          TSYNC_FFMPEG: 1

      - name: Save the opam root
        if: steps.opam-root.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: opam-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('*.opam', 'linux/build.sh') }}

      - name: Package
        run: ./linux/rpm/build.sh

      - name: Verify the package installs
        run: ./linux/rpm/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tsync-rpm-${{ matrix.arch }}-${{ strategy.job-index }}
          path: dist/*.rpm

      - if: env.PUBLISH == 'true'
        uses: ./.github/actions/publish-nightly
        with:
          files: dist/*.rpm
          sha: ${{ env.SHA }}
          token: ${{ github.token }}
