name: release-rpm

# Same trigger as release-macos: runs after `test` passes on main, so a red
# build never reaches the nightly download URL.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Its own group, so the four release workflows do not serialize behind each
# other. They all upload to the same nightly tag, which the publish step below
# is written to tolerate.
concurrency:
  group: release-rpm
  cancel-in-progress: false

jobs:
  rpm:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:43", "fedora:44"]
        arch: [amd64, arm64]
        # `arch` has to be a matrix key, not only an include key: an include
        # entry sharing no key with the matrix is merged into every combination
        # instead of selecting one, which collapses this to two jobs.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Install system dependencies
        # fuse3, not fuse: the daemon links libfuse3, which mounts by running
        # the setuid fusermount3, and only fuse3 provides it.
        #
        # gmp-devel is for mirage-crypto-pk -> conf-gmp.
        run: |
          dnf install -y \
            opam gcc gcc-c++ make m4 pkgconf-pkg-config git curl unzip rsync \
            tar gzip rpm-build systemd-rpm-macros gh \
            fuse3-devel fuse3 xxhash-devel libev-devel openssl-devel gmp-devel \
            pcre2-devel dbus-devel \
            cmake extra-cmake-modules qt6-qtbase-devel kf6-kio-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # linux/build.sh builds a whole opam switch, which is nearly all of this
      # job. The key covers everything that decides what the switch should hold
      # -- the opam files, the compiler build.sh names, the pin list. What a
      # restored switch cannot know, a git pin that moved or a new release in
      # opam-repository, is what scripts/opam_deps.sh updates and upgrades to
      # before it installs, so a hit is fast rather than stale. build.sh runs
      # `opam clean` after: every container job keeps one of these and they
      # share the repository's cache budget.
      - name: Restore the opam root
        id: opam-root
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: opam-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('opam/*.opam', 'linux/build.sh', 'scripts/opam_deps.sh') }}

      - name: Build
        run: ./linux/build.sh

      - name: Save the opam root
        if: steps.opam-root.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: opam-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('opam/*.opam', 'linux/build.sh', 'scripts/opam_deps.sh') }}

      - name: Package
        run: ./linux/rpm/build.sh

      - name: Verify the packages install
        # Catches a bad Requires or a missing library before anyone downloads it.
        # ldd alone cannot fail here -- the build container installed dbus-devel,
        # so the runtime library is present whatever the package declares. The
        # Requires assertions are what actually hold: the tray must ask for
        # libdbus, and tsync must not, which is the point of shipping them
        # separately.
        run: |
          dnf install -y ./dist/*.rpm
          for b in tsync tsync-tray; do
            test "$(ldd "$(command -v $b)" | grep -c 'not found')" = 0
          done
          # Nothing in an install proves these shipped -- they no-op in a
          # container, where /run/systemd/system does not exist. Unqualified
          # %post in the spec means the base package and nothing else, which is
          # what the tray assertion holds to.
          for s in postinstall preuninstall; do
            rpm -qp --scripts dist/tsync_*.rpm | grep -q "^$s scriptlet"
          done
          # And that both of them name the instances rather than the template
          # alone: the systemd macros act on tsync@.service, which no running
          # tsync@<user> answers to, so a spec that only calls them restarts
          # nothing and stops nothing.
          test "$(rpm -qp --scripts dist/tsync_*.rpm | grep -c "'tsync@\*\.service'")" = 2
          ! rpm -qp --scripts dist/tsync-tray_*.rpm | grep -q 'scriptlet'
          rpm -qpR dist/tsync-tray_*.rpm | grep -q libdbus-1
          rpm -qpR dist/tsync-dolphin_*.rpm | grep -q libKF6
          ! rpm -qpR dist/tsync-tray_*.rpm | grep -q libKF6
          # The plugin resolves the mount rules by soname along its rpath, and
          # the object answering that soname ships in the base package. ldd
          # finding it is what says the two halves agree.
          test "$(ldd /usr/lib*/qt6/plugins/kf6/kfileitemaction/tsyncdolphin.so \
            | grep -c 'not found')" = 0
          ldd /usr/lib*/qt6/plugins/kf6/kfileitemaction/tsyncdolphin.so \
            | grep -q libtsync_mounts.so
          # ldd alone cannot catch a leaked build path here: this is the machine
          # that built it, so the build tree still exists and the bogus entry
          # resolves. What ships would not.
          ! objdump -p /usr/lib*/qt6/plugins/kf6/kfileitemaction/tsyncdolphin.so \
            | grep -E 'RPATH|RUNPATH' | grep -q _build
          rpm -ql tsync | grep -q libtsync_mounts.so
          ! rpm -ql tsync-dolphin | grep -q libtsync_mounts.so
          ! rpm -qpR dist/tsync_*.rpm | grep -q libdbus-1

      - uses: actions/upload-artifact@v4
        with:
          name: tsync-rpm-${{ matrix.arch }}-${{ strategy.job-index }}
          path: dist/*.rpm

      - uses: ./.github/actions/publish-nightly
        with:
          files: dist/*.rpm
          sha: ${{ env.SHA }}
          token: ${{ github.token }}
