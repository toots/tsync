name: release

# Runs after `test` passes on main, so a red build never reaches the nightly
# download URL. workflow_dispatch is there to re-cut a release by hand.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    # A keychain prompt or a stalled notarization otherwise sits until the
    # 6-hour job cap, and blocks every queued release behind it.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # workflow_run checks out the default branch unless told otherwise.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Pin packages
        run: |
          opam pin -ny .
          opam pin add -ny git+https://github.com/toots/aws-s3.git#tsync
      - name: Install dependencies
        run: |
          brew install xcodegen libev coreutils dylibbundler pkg-config openssl@3
          echo "CPATH=$(brew --prefix libev)/include:$CPATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix libev)/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          # openssl@3 is keg-only, so conf-libssl only finds it via pkg-config.
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
      - name: Install OCaml dependencies
        # conf-libev goes in first, on its own: lwt reads libev support from
        # %{conf-libev:installed}% when it builds, and conf-libev is only a
        # depopt, so nothing orders the two. An lwt built before it has no libev
        # engine at all and silently falls back to select, which cannot watch a
        # descriptor at or above FD_SETSIZE — see Frontend.use_libev.
        #
        # lwt_ssl is optional and enables the OpenSSL TLS backend, which is the
        # faster one and what a released build should ship with.
        run: |
          opam install -y conf-libev
          opam install --deps-only -y tsync tsync-s3
          opam install -y lwt_ssl

      - name: Import signing assets
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          PROFILE_APP_B64: ${{ secrets.MACOS_PROFILE_APP }}
          PROFILE_APPEX_B64: ${{ secrets.MACOS_PROFILE_APPEX }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # -A, not -T codesign: pkgbuild needs the Installer key too, and any
          # tool missing from the ACL raises a keychain prompt that hangs the
          # runner forever. This keychain is a throwaway in RUNNER_TEMP.
          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null

          echo "$PROFILE_APP_B64" | base64 -d > "$RUNNER_TEMP/app.provisionprofile"
          echo "$PROFILE_APPEX_B64" | base64 -d > "$RUNNER_TEMP/appex.provisionprofile"
          echo "$AC_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/ac_key.p8"

          # The .p12 holds both Developer ID certificates: Application signs the
          # bundle, Installer signs the .pkg. Only the former is a codesigning
          # identity, so the latter has to be looked up without -p codesigning.
          app_identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          installer_identity=$(security find-identity -v "$keychain" \
            | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)"/\1/')
          test -n "$app_identity" -a -n "$installer_identity"
          echo "SIGN_IDENTITY=$app_identity" >> $GITHUB_ENV
          echo "INSTALLER_IDENTITY=$installer_identity" >> $GITHUB_ENV

      - name: Package
        env:
          PROFILE_APP: ${{ runner.temp }}/app.provisionprofile
          PROFILE_APPEX: ${{ runner.temp }}/appex.provisionprofile
          AC_API_KEY_PATH: ${{ runner.temp }}/ac_key.p8
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          BUNDLE_VERSION: ${{ github.run_number }}
          BUNDLE_SHORT_VERSION: 0.0.0
        run: |
          make generate
          opam exec -- ./package.sh
        working-directory: macos

      - uses: actions/upload-artifact@v4
        with:
          name: tsync-pkg
          path: macos/dist/tsync.pkg

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly >/dev/null 2>&1 \
            || gh release create nightly --prerelease --title nightly --notes ""
          gh release upload nightly macos/dist/tsync.pkg --clobber
          gh release edit nightly --notes "Rolling build of main, from $SHA."

  android:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The floor the daemon runs on, and the app's minSdk. The two must agree.
      ANDROID_API: "26"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # conf-ndk-android reads this itself, so it is exported for the later
      # steps rather than passed to each.
      - name: Locate the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          test -d "$NDK"
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV
      - uses: ocaml/setup-ocaml@v3
        with:
          # What the cross compiler package is built for; the host switch has to
          # match it.
          ocaml-compiler: "5.4.1"
      # Building the cross compiler and both dependency sets is most of this
      # job. Restored after setup-ocaml, which re-initialises the switch and
      # would wipe it, and keyed on the files that say what goes in.
      - uses: actions/cache@v4
        with:
          # The switch lives in the workspace, not the opam root, so caching
          # ~/.opam alone leaves every run rebuilding the compiler.
          path: |
            ~/.opam
            _opam
          key: opam-android-${{ hashFiles('opam/*.opam', '.github/workflows/release.yml') }}
      # `dune -x` builds the host context too, and on linux that one includes
      # the FUSE frontend.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 pkg-config libev-dev
      - name: Pin packages
        # `opam repository add <url>` on a restored root finds the repository
        # already there and keeps the snapshot the cache was built from, which
        # is a silently stale package set. It is replaced on every run.
        run: |
          opam pin -ny .
          opam pin add -ny fuse3 git+https://github.com/toots/ocamlfuse.git
          opam repository remove android --all >/dev/null 2>&1 || true
          opam repository add android git+https://github.com/toots/opam-cross-android.git
      - name: Install OCaml dependencies
        # The cross packages mirror tsync.opam's depends, minus what the Android
        # build has no frontend for (FUSE) and does not configure (S3).
        run: |
          opam install -y conf-libev
          opam install --deps-only -y tsync tsync-fuse
          opam install -y ocaml-android \
            conf-libev-android cohttp-lwt-unix-android conduit-lwt-unix-android \
            digestif-android eqaf-android yojson-android lwt-android \
            ppx_blob-android mem_usage-android tls-android base64-android \
            x509-android mirage-crypto-pk-android cmdliner-android
      - name: Cross-build the daemon
        run: opam exec -- dune build -x android bin/tsync.exe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Debug-signed: a nightly has to install on a device without release keys,
      # and an unsigned release APK does not.
      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: tsync-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The macOS job may be creating the same release at this moment.
          gh release view nightly >/dev/null 2>&1 \
            || gh release create nightly --prerelease --title nightly --notes "" \
            || gh release view nightly >/dev/null
          cp android/app/build/outputs/apk/debug/app-debug.apk tsync.apk
          gh release upload nightly tsync.apk --clobber
