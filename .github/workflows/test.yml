# The gate (10 §3): hermetic, so it needs no secret and runs on forks. Every
# release waits on it, and nothing is published from a commit it did not pass.
name: test

on:
  push:
    branches: [main, rewrite]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        # libdbus and the bus daemon are for the tray and its suite, which
        # runs on a private session bus.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libfuse3-dev fuse3 libgmp-dev pkg-config libdbus-1-dev dbus

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      # 10 §4.1: setup-ocaml caches the compiler only; the switch is cached
      # here and saved right after the install, so a failed job neither loses
      # it nor saves a half-built one.
      - name: Restore the opam switch
        id: opam-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-test-linux-${{ hashFiles('*.opam', 'scripts/opam_deps.sh', '.ocamlformat') }}

      - name: OCaml libraries
        env:
          TSYNC_FORMATTER: 1
        run: ./scripts/opam_deps.sh tsync tsync-tls tsync-ssl tsync-fuse tsync-tray

      - name: Save the opam switch
        if: steps.opam-switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: opam-test-linux-${{ hashFiles('*.opam', 'scripts/opam_deps.sh', '.ocamlformat') }}

      - name: Build
        run: opam exec -- dune build

      - name: Formatting
        run: opam exec -- dune build @fmt

      # 10 §4.3: an optional library whose dependency is missing is skipped
      # quietly.
      - name: The FUSE frontend and both TLS implementations are built
        run: |
          info=$(opam exec -- ./_build/default/bin/tsync.exe build-info)
          echo "$info"
          echo "$info" | grep -Eq '^frontends:.*\bfuse\b'
          echo "$info" | grep -Eq '^tls:.*\bopenssl\b'
          echo "$info" | grep -Eq '^tls:.*\bnative\b'

      - name: Tests
        run: opam exec -- dune build @runtest --force

  # 10 §3.1 item 5: the android frontend in the desktop binary, its hermetic
  # checks, then the app's JVM suites, the wire suite against that binary. No
  # device and no cross toolchain.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev pkg-config

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Restore the opam switch
        id: opam-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-test-android-${{ hashFiles('*.opam', 'scripts/opam_deps.sh') }}

      - name: OCaml libraries
        run: ./scripts/opam_deps.sh tsync tsync-tls

      - name: Save the opam switch
        if: steps.opam-switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: opam-test-android-${{ hashFiles('*.opam', 'scripts/opam_deps.sh') }}

      - name: Build
        run: opam exec -- dune build

      - name: The android frontend is built
        run: |
          info=$(opam exec -- ./_build/default/bin/tsync.exe build-info)
          echo "$info"
          echo "$info" | grep -Eq '^frontends:.*\bandroid\b'

      - name: Frontend tests
        run: opam exec -- dune build @tests/android/runtest --force

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Each task fails when it executed no test, and :core:test when the wire
      # suite ran none against TSYNC_BIN.
      - name: App JVM suites
        working-directory: android
        env:
          TSYNC_BIN: ${{ github.workspace }}/_build/default/bin/tsync.exe
        run: ./gradlew :core:test :app:testDebugUnitTest -PnoCore

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        id: brew
        run: |
          brew install xcodegen pkg-config openssl@3 gmp
          # openssl@3 is keg-only, so conf-libssl finds it only via pkg-config.
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          # 10 §4.1: a restored switch links the Cellar directory of these
          # formulae, which a newer version moves.
          echo "linked=$(brew list --versions openssl@3 gmp | tr ' ' '-' | paste -sd_ -)" >> "$GITHUB_OUTPUT"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Restore the opam switch
        id: opam-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-test-macos-${{ hashFiles('*.opam', 'scripts/opam_deps.sh') }}-${{ steps.brew.outputs.linked }}

      - name: OCaml libraries
        run: ./scripts/opam_deps.sh tsync tsync-tls tsync-ssl

      - name: Save the opam switch
        if: steps.opam-switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: opam-test-macos-${{ hashFiles('*.opam', 'scripts/opam_deps.sh') }}-${{ steps.brew.outputs.linked }}

      - name: Build
        run: opam exec -- dune build

      - name: The File Provider frontend and both TLS implementations are built
        run: |
          info=$(opam exec -- ./_build/default/bin/tsync.exe build-info)
          echo "$info"
          echo "$info" | grep -Eq '^frontends:.*\bfile_provider\b'
          echo "$info" | grep -Eq '^tls:.*\bopenssl\b'
          echo "$info" | grep -Eq '^tls:.*\bnative\b'

      # A short TMPDIR: the runner's own is past the 104-byte socket path limit
      # (09 §5.9).
      - name: Tests
        env:
          TMPDIR: /tmp
        run: opam exec -- dune build @runtest --force

      - name: Swift tests
        run: make -C macos test

  # 10 §3.1 items 3 and 4: the bucket functions, and the vectors that keep
  # their second implementation of the chunk key and the delete-request key in
  # agreement with the OCaml suite's golden files.
  lambda-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python libraries
        run: pip install boto3 moto pytest xxhash
      - name: Share handler and chunk verifier (S3)
        run: pytest lambda/test_handler.py lambda/test_verify.py
      - name: Keys agree with the OCaml implementation
        run: pytest lambda/test_chunk_key.py lambda/test_gc_job_key.py

  lambda-gcs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 \
            fsouza/fake-gcs-server -scheme http -public-host localhost:4443
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:4443/storage/v1/b?project=test" >/dev/null && exit 0
            sleep 1
          done
          echo "fake-gcs-server did not answer"; exit 1
      - name: Python libraries
        run: pip install google-cloud-storage pytest xxhash
      - name: Store and chunk verifier (GCS)
        env:
          STORAGE_EMULATOR_HOST: http://localhost:4443
        run: pytest lambda/test_store_gcs.py lambda/test_verify_gcs.py

  # 10 §3.1 item 5: opam's default resolution of tsync's TLS alternative, and a
  # build with one implementation: what `opam install tsync` gives a user. It
  # does not use scripts/opam_deps.sh, on purpose.
  opam-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Install tsync alone
        run: opam pin -ny . && opam install -y tsync

      - name: Native TLS only
        run: |
          info=$(opam exec -- tsync build-info)
          echo "$info"
          opam list --installed --short --color=never | grep -qx tsync-tls
          if opam list --installed --short --color=never | grep -qx tsync-ssl; then exit 1; fi
          echo "$info" | grep -Eq '^tls: native$'
