name: test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install boto3 moto pytest
      - name: Run share handler tests (S3 store)
        run: pytest lambda/test_handler.py

  lambda-gcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 \
            fsouza/fake-gcs-server -scheme http -public-host localhost:4443
          for i in $(seq 1 30); do
            curl -sf "http://localhost:4443/storage/v1/b?project=test" >/dev/null && break
            sleep 1
          done
      - name: Install test dependencies
        run: pip install google-cloud-storage pytest
      - name: Run GCS store tests
        env:
          STORAGE_EMULATOR_HOST: http://localhost:4443
        run: pytest lambda/test_store_gcs.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 pkg-config libev-dev
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
      - name: Pin packages
        run: |
          opam pin -ny .
          opam pin add -ny fuse3 git+https://github.com/toots/ocamlfuse.git
          opam pin add -ny git+https://github.com/toots/aws-s3.git#tsync
      - name: Install OCaml dependencies
        run: opam install --deps-only -y tsync tsync-s3 tsync-fuse
      - name: Build OCaml daemon
        run: opam exec -- dune build
      - name: Run tests
        run: opam exec -- dune test
      # Drives a real FUSE mount: a store, a mount, and a second client, all
      # staged under a scratch directory and taken down again. Separate from
      # `dune test`, which must stay hermetic — this one mounts a filesystem.
      # Everything it touches is its own, so there is nothing to clean up after.
      - name: End-to-end (FUSE)
        run: opam exec -- make -C linux e2e
      # Against the real object stores, because a write precondition is exactly
      # what an emulator approximates least well, and put_if_absent is what
      # decides a folder's identity. Forks receive no secrets, so this reports
      # itself skipped there rather than failing for a reason nobody can act on.
      - name: Backend conformance (real GCS and S3)
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          TSYNC_CI_GCS_BUCKET: ${{ secrets.TSYNC_CI_GCS_BUCKET }}
          TSYNC_CI_GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.TSYNC_CI_GCS_SERVICE_ACCOUNT_KEY }}
          TSYNC_CI_S3_BUCKET: ${{ secrets.TSYNC_CI_S3_BUCKET }}
          TSYNC_CI_S3_REGION: ${{ secrets.TSYNC_CI_S3_REGION }}
          TSYNC_CI_S3_ACCESS_KEY_ID: ${{ secrets.TSYNC_CI_S3_ACCESS_KEY_ID }}
          TSYNC_CI_S3_SECRET_ACCESS_KEY: ${{ secrets.TSYNC_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          # A secret that is absent arrives as the empty string, and the test
          # would then report "no credentials" and exit 2. Say which one is
          # missing instead: that is a repository setting, not a code failure.
          missing=
          for v in TSYNC_CI_GCS_BUCKET TSYNC_CI_GCS_SERVICE_ACCOUNT_KEY \
                   TSYNC_CI_S3_BUCKET TSYNC_CI_S3_REGION \
                   TSYNC_CI_S3_ACCESS_KEY_ID TSYNC_CI_S3_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::conformance needs these repository secrets:$missing"
            echo "::error::run scripts/setup_ci_secrets.sh to provision them"
            exit 1
          fi
          opam exec -- make -C linux conformance

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
      - name: Pin packages
        run: |
          opam pin -ny .
          opam pin add -ny git+https://github.com/toots/aws-s3.git#tsync
      - name: Install dependencies
        run: |
          brew install xcodegen libev coreutils pkg-config openssl@3
          echo "CPATH=$(brew --prefix libev)/include:$CPATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix libev)/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          # openssl@3 is keg-only, so conf-libssl only finds it via pkg-config.
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
      - name: Install OCaml dependencies
        # lwt_ssl is optional and enables the OpenSSL TLS backend, which is the
        # faster one and what a released build should ship with.
        run: |
          opam install --deps-only -y tsync tsync-s3
          opam install -y lwt_ssl
      - name: Build OCaml daemon
        run: opam exec -- dune build
      - name: Run tests
        run: opam exec -- dune test
      # Builds the Swift targets and runs their tests. The protocol tests start
      # the daemon built above against a local store in a temporary directory, so
      # they need no network, no signing and no registered domain — and they are
      # what holds the two halves of the IPC contract together.
      #
      # Assembling the bundle — embedding the daemon, dylibbundler, signing,
      # packaging — is exercised by the release workflow, which has the signing
      # credentials.
      - name: Build and test macOS app
        run: |
          make generate
          xcodebuild -project tsync.xcodeproj -scheme TsyncApp \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test
        working-directory: macos
