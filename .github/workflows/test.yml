name: test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install boto3 moto pytest
      - name: Run share handler tests (S3 store)
        run: pytest lambda/test_handler.py

  lambda-gcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 \
            fsouza/fake-gcs-server -scheme http -public-host localhost:4443
          for i in $(seq 1 30); do
            curl -sf "http://localhost:4443/storage/v1/b?project=test" >/dev/null && break
            sleep 1
          done
      - name: Install test dependencies
        run: pip install google-cloud-storage pytest
      - name: Run GCS store tests
        env:
          STORAGE_EMULATOR_HOST: http://localhost:4443
        run: pytest lambda/test_store_gcs.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse pkg-config libxxhash-dev
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Pin packages
        run: |
          opam pin -ny .
          opam pin add -ny fuse3 git+https://github.com/toots/ocamlfuse.git
          opam pin add -ny git+https://github.com/toots/aws-s3.git#tsync
      - name: Install OCaml dependencies
        run: opam install --deps-only -y tsync tsync-s3 tsync-fuse
      - name: Build OCaml daemon
        run: opam exec -- dune build
      - name: Run tests
        run: opam exec -- dune test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Pin packages
        run: |
          opam pin -ny .
          opam pin add -ny git+https://github.com/toots/aws-s3.git#tsync
      - name: Install dependencies
        run: |
          brew install xcodegen xxhash coreutils
          echo "CPATH=$(brew --prefix xxhash)/include:$CPATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix xxhash)/lib:$LIBRARY_PATH" >> $GITHUB_ENV
      - name: Install OCaml dependencies
        run: opam install --deps-only -y tsync tsync-s3
      - name: Build OCaml daemon
        run: opam exec -- dune build
      - name: Run tests
        run: opam exec -- dune test
      # Compile-only check that the Swift targets still build. Assembling the
      # bundle — embedding the daemon, dylibbundler, signing, packaging — is
      # exercised by the release workflow, which has the signing credentials.
      - name: Build macOS app
        run: |
          make generate
          xcodebuild -project tsync.xcodeproj -scheme TsyncApp \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
        working-directory: macos
