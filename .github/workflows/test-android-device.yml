name: test-android-device

# 10 §3.4: the app's instrumented suite on an emulator, opt-in since an
# emulator boot costs minutes.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: test-android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'android-device')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's ABI is not the core's, so this package carries no core
      # library: -PnoCore fails the build if one is staged.
      - name: Instrumented suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -PnoCore

      - name: The suite ran
        run: |
          ran=$(cat android/app/build/outputs/androidTest-results/connected/debug/*.xml \
            | grep -o '<testsuite [^>]*tests="[0-9]*"' | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' \
            | paste -sd+ - | bc)
          echo "instrumented tests executed: ${ran:-0}"
          [ "${ran:-0}" -gt 0 ]

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          path: android/app/build/reports/androidTests
