# The store contract against the real GCS and S3 services (10 §3.3): the
# things it asks about are the ones an emulator approximates least well,
# whether a write precondition is honoured and whether a bulk delete reports
# per key what it refused.
#
# Manual only: per push it dominated the CI object-store spend. One job on
# purpose: a run works under a prefix named after the run id, which every job
# of a run shares, so a second job would sweep the first one's objects.
name: conformance

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stores:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgmp-dev pkg-config

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Restore the opam switch
        id: opam-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-conformance-${{ hashFiles('*.opam', 'scripts/opam_deps.sh') }}

      # No fuse: the store drivers are all this asks about.
      - name: OCaml libraries
        run: ./scripts/opam_deps.sh tsync tsync-tls

      - name: Save the opam switch
        if: steps.opam-switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: opam-conformance-${{ hashFiles('*.opam', 'scripts/opam_deps.sh') }}

      - name: Store contract (real GCS and S3)
        env:
          TSYNC_CI_REQUIRE_REAL: "gcs,s3"
          TSYNC_CI_GCS_BUCKET: ${{ secrets.TSYNC_CI_GCS_BUCKET }}
          TSYNC_CI_GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.TSYNC_CI_GCS_SERVICE_ACCOUNT_KEY }}
          TSYNC_CI_S3_BUCKET: ${{ secrets.TSYNC_CI_S3_BUCKET }}
          TSYNC_CI_S3_REGION: ${{ secrets.TSYNC_CI_S3_REGION }}
          TSYNC_CI_S3_ACCESS_KEY_ID: ${{ secrets.TSYNC_CI_S3_ACCESS_KEY_ID }}
          TSYNC_CI_S3_SECRET_ACCESS_KEY: ${{ secrets.TSYNC_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          # 10 §6: an absent secret arrives as the empty string; name it and
          # the script that provisions it rather than fail inside the suite.
          missing=
          for v in TSYNC_CI_GCS_BUCKET TSYNC_CI_GCS_SERVICE_ACCOUNT_KEY \
                   TSYNC_CI_S3_BUCKET TSYNC_CI_S3_REGION \
                   TSYNC_CI_S3_ACCESS_KEY_ID TSYNC_CI_S3_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::conformance needs these repository secrets:$missing"
            echo "::error::run scripts/setup_ci_secrets.sh to provision them"
            exit 1
          fi
          opam exec -- dune build @tests/store/runtest --force
