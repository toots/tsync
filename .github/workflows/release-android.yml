name: release-android

# Same trigger as release-macos.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  apk:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Must match the app's minSdk.
      ANDROID_API: "26"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Locate the NDK
        # conf-ndk-android reads this.
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          test -d "$NDK"
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
      # The cross packages below are the whole of this job's build time, and
      # setup-ocaml caches only the compiler. Keyed on this file because the
      # package list lives here rather than in an opam file. Staleness is
      # handled the same way scripts/opam_deps.sh handles it: the update and
      # upgrade below re-fetch both repositories -- the cross one is a branch
      # pin, so nothing else would look at a new revision -- and rebuild
      # whatever moved.
      - name: Restore the opam switch
        id: opam-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-android-${{ hashFiles('.github/workflows/release-android.yml') }}
      - name: Register the cross repository
        run: |
          opam repository remove android --all >/dev/null 2>&1 || true
          opam repository add android git+https://github.com/toots/opam-cross-android.git#tsync
          opam update
          opam upgrade -y
      - name: Install OCaml dependencies
        run: |
          opam install -y ppx_blob
          # conf-*-android only detect what the sysroot holds; build-* fill it.
          opam install -y ocaml-android build-libev-android build-gmp-android
          # tls-lwt-android, not tls-android: conduit takes its TLS backend from
          # a depopt, and without that one it links a stub that refuses every
          # https connection at runtime.
          opam install -y \
            conf-libev-android cohttp-lwt-unix-android.6.2.2 conduit-lwt-unix-android \
            digestif-android eqaf-android yojson-android lwt-android \
            ppx_blob-android mem_usage-android base64-android tls-lwt-android \
            x509-android mirage-crypto-pk-android cmdliner-android \
            memtrace-android bigstringaf-android
      - name: Save the opam switch
        if: steps.opam-switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: opam-android-${{ hashFiles('.github/workflows/release-android.yml') }}
      - name: Cross-build the domain
        # The context path, not the bare target: that builds the host context
        # too, which wants FUSE.
        run: |
          opam exec -- dune build -x android \
            _build/default.android/lib/app/frontends/android/jni/libtsyncjni.so
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The same key every time, so a phone takes each build as an update of the
      # one before and keeps its settings. Provisioned by
      # scripts/setup_android_signing.sh.
      - name: Unpack the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tsync.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/tsync.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PrequireDaemon
        working-directory: android
      - name: Name the artifact
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/tsync-arm64-v8a.apk
          # A build signed by anything but our key would make every phone reinstall.
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)" verify --print-certs \
              dist/tsync-arm64-v8a.apk \
            | grep -q "certificate DN: CN=tsync" \
            || { echo "the APK is not signed by the tsync key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tsync-apk
          path: dist/tsync-arm64-v8a.apk

      - uses: ./.github/actions/publish-nightly
        with:
          files: dist/tsync-arm64-v8a.apk
          sha: ${{ env.SHA }}
          token: ${{ github.token }}
