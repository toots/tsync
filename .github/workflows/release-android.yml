name: release-android

# Same trigger as release-macos.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  apk:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Must match the app's minSdk.
      ANDROID_API: "26"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Locate the NDK
        # conf-ndk-android reads this.
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          test -d "$NDK"
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
          dune-cache: true
      - uses: actions/cache@v4
        with:
          # The switch lives in the workspace, so ~/.opam alone is not enough.
          path: |
            ~/.opam
            _opam
          # Bump when the package list below changes.
          key: opam-android-v3
      - name: Register the cross repository
        run: |
          opam repository remove android --all >/dev/null 2>&1 || true
          opam repository add android git+https://github.com/ocaml-cross/opam-cross-android.git
          opam update android
      - name: Install OCaml dependencies
        run: |
          opam install -y ppx_blob
          # conf-*-android only detect what the sysroot holds; build-* fill it.
          opam install -y ocaml-android build-libev-android build-gmp-android
          # tls-lwt-android, not tls-android: conduit takes its TLS backend from
          # a depopt, and without that one it links a stub that refuses every
          # https connection at runtime.
          opam install -y \
            conf-libev-android cohttp-lwt-unix-android conduit-lwt-unix-android \
            digestif-android eqaf-android yojson-android lwt-android \
            ppx_blob-android mem_usage-android base64-android tls-lwt-android \
            x509-android mirage-crypto-pk-android cmdliner-android \
            memtrace-android bigstringaf-android
      - name: Cross-build the daemon
        # The context path, not `bin/tsync.exe`: that builds the host context too,
        # which wants FUSE.
        run: opam exec -- dune build -x android _build/default.android/bin/tsync.exe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug
        working-directory: android
      - name: Name the artifact
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/tsync-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tsync-apk
          path: dist/tsync-arm64-v8a.apk

      - uses: ./.github/actions/publish-nightly
        with:
          files: dist/tsync-arm64-v8a.apk
          sha: ${{ env.SHA }}
          token: ${{ github.token }}
