name: release-deb

# Same trigger as release-macos: runs after `test` passes on main, so a red
# build never reaches the nightly download URL.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Its own group, so the four release workflows do not serialize behind each
# other. They all upload to the same nightly tag, which the publish step below
# is written to tolerate.
concurrency:
  group: release-deb
  cancel-in-progress: false

jobs:
  deb:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13, "ubuntu:26.04"]
        arch: [amd64, arm64]
        # `arch` has to be a matrix key, not only an include key: an include
        # entry sharing no key with the matrix is merged into every combination
        # instead of selecting one, which collapses this to two jobs.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Install system dependencies
        # fuse3, not fuse: the daemon links libfuse3, which mounts by running
        # the setuid /usr/bin/fusermount3. That binary is in fuse3; the fuse
        # package is the FUSE 2 userspace and provides fusermount, which
        # libfuse3 will not use.
        #
        # libgmp-dev is for mirage-crypto-pk -> conf-gmp, and gh is for the
        # publish step: neither container ships them.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            opam build-essential dpkg-dev m4 pkg-config git curl \
            ca-certificates unzip rsync gh \
            libfuse3-dev fuse3 libxxhash-dev libev-dev libssl-dev libgmp-dev \
            libpcre2-dev libdbus-1-dev \
            cmake extra-cmake-modules qt6-base-dev libkf6kio-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build
        run: ./linux/build.sh

      - name: Package
        run: ./linux/deb/build.sh

      - name: Verify the packages install
        # Catches a bad Depends or a missing library before anyone downloads it.
        # ldd alone cannot fail here -- the build container installed
        # libdbus-1-dev, so the runtime library is present whatever the package
        # declares. The Depends assertions are what actually hold: the tray must
        # ask for libdbus, and tsync must not, which is the point of shipping
        # them separately.
        run: |
          apt-get install -y ./dist/*.deb
          for b in tsync tsync-tray; do
            test "$(ldd "$(command -v $b)" | grep -c 'not found')" = 0
          done
          dpkg-deb -f dist/tsync-tray_*.deb Depends | grep -q libdbus-1
          ! dpkg-deb -f dist/tsync_*.deb Depends | grep -q libdbus-1
          dpkg-deb -f dist/tsync-dolphin_*.deb Depends | grep -qi kf6
          ! dpkg-deb -f dist/tsync-tray_*.deb Depends | grep -qi kf6
          # The plugin resolves the mount rules by soname along its rpath, and
          # the object answering that soname ships in the base package. ldd
          # finding it is what says the two halves agree.
          test "$(ldd /usr/lib/*/qt6/plugins/kf6/kfileitemaction/tsyncdolphin.so \
            | grep -c 'not found')" = 0
          ldd /usr/lib/*/qt6/plugins/kf6/kfileitemaction/tsyncdolphin.so \
            | grep -q libtsync_mounts.so
          # ldd alone cannot catch a leaked build path here: this is the machine
          # that built it, so the build tree still exists and the bogus entry
          # resolves. What ships would not.
          ! objdump -p /usr/lib/*/qt6/plugins/kf6/kfileitemaction/tsyncdolphin.so \
            | grep -E 'RPATH|RUNPATH' | grep -q _build
          dpkg -L tsync | grep -q libtsync_mounts.so
          ! dpkg -L tsync-dolphin | grep -q libtsync_mounts.so

      - uses: actions/upload-artifact@v4
        with:
          name: tsync-deb-${{ matrix.arch }}-${{ strategy.job-index }}
          path: dist/*.deb

      - uses: ./.github/actions/publish-nightly
        with:
          files: dist/*.deb
          sha: ${{ env.SHA }}
          token: ${{ github.token }}
