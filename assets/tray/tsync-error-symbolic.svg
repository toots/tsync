<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="currentColor">
  <title>tsync: unreachable</title>
  <!-- Every mark is a fill, never a stroke. GTK recolours a symbolic icon by
       forcing `fill` on rect, circle and path; a stroked glyph keeps its own
       colour and gains a filled interior, so it survives as a blob in the
       wrong colour. The cross is a rotated plus for the same reason. -->
  <path d="M9 5 11 3V15a2 2 0 0 0 2 2h1v2h-1a4 4 0 0 1-4-4Z"/>
  <path d="M6 7h8v2H6Z"/>
  <g transform="rotate(45 17.5 18)">
    <path d="M14.5 17h6v2h-6Z"/>
    <path d="M16.5 15h2v6h-2Z"/>
  </g>
</svg>
