name: tsync
options:
  bundleIdPrefix: org.feverdreamtv
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    DEVELOPMENT_TEAM: PSE2VP6582
    CODE_SIGN_STYLE: Automatic

targets:
  TsyncApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: TsyncApp
        excludes:
          - LaunchAgents
      # file-provider §11: the service's agent, defined inside the bundle for
      # SMAppService.agent(plistName:).
      - path: TsyncApp/LaunchAgents/org.feverdreamtv.tsync.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync
        CODE_SIGN_ENTITLEMENTS: TsyncApp/TsyncApp.entitlements
        INFOPLIST_FILE: TsyncApp/Info.plist
        # Regenerate the catalog with scripts/make-icons.sh after changing
        # anything in assets/. Only the app names an app icon: an app-extension
        # takes the host bundle's. The menu bar image sets in the same catalog
        # are looked up by name at runtime, so they need no setting here.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../Frameworks"
    dependencies:
      - target: TsyncFileProvider
        embed: true

  TsyncFileProvider:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: TsyncFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync.fileprovider
        CODE_SIGN_ENTITLEMENTS: TsyncFileProvider/TsyncFileProvider.entitlements
        INFOPLIST_FILE: TsyncFileProvider/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: NO

  # The pure parts of both targets, checked against the spec: references,
  # versions, change batches, ranges, error codes, cursors and config reading.
  TsyncTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: TsyncTests
      - path: TsyncFileProvider/Row.swift
      - path: TsyncFileProvider/Item.swift
      - path: TsyncFileProvider/ChangeBatch.swift
      - path: TsyncFileProvider/PartialRange.swift
      - path: TsyncFileProvider/Cursors.swift
      - path: TsyncFileProvider/Errors.swift
      - path: TsyncApp/Reconciler.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TsyncApp:
    build:
      targets:
        TsyncApp: all
        TsyncTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TsyncTests
