name: tsync
options:
  bundleIdPrefix: org.feverdreamtv
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    DEVELOPMENT_TEAM: PSE2VP6582
    CODE_SIGN_STYLE: Automatic

targets:
  TsyncApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: TsyncApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync
        CODE_SIGN_ENTITLEMENTS: TsyncApp/TsyncApp.entitlements
        INFOPLIST_FILE: TsyncApp/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../Frameworks"
    dependencies:
      - target: TsyncFileProvider
        embed: true

  TsyncFileProvider:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: TsyncFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync.fileprovider
        CODE_SIGN_ENTITLEMENTS: TsyncFileProvider/TsyncFileProvider.entitlements
        INFOPLIST_FILE: TsyncFileProvider/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: NO

  # Logic the two targets share, checked on its own. The identifier scheme and
  # the error mapping are both contracts with the daemon that nothing else
  # notices breaking: an identifier that round-trips wrong renames every item,
  # and an error mapped to the wrong domain silently stops the system retrying.
  TsyncTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
      - path: TsyncTests
      # The item model belongs with the extension, but building one out of what
      # the daemon actually said is part of what these tests check.
      - path: TsyncFileProvider/Item.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TsyncApp:
    build:
      targets:
        TsyncApp: all
        TsyncTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TsyncTests
