# The iOS app and its File Provider extension. Generate with xcodegen on a Mac
# after ./build-core.sh has put the core's objects in core/.
name: TsyncPhone
options:
  bundleIdPrefix: org.feverdreamtv
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: PSE2VP6582
    CODE_SIGN_STYLE: Automatic
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge.h
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../core $(SRCROOT)/../../lib/frontends/android/jni"
    # The core: the OCaml runtime and tsync as one object per SDK.
    "OTHER_LDFLAGS[sdk=iphoneos*]": "$(SRCROOT)/core/iphoneos/libtsyncios.o -framework Network -framework Security"
    "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(SRCROOT)/core/iphonesimulator/libtsyncios.o -framework Network -framework Security"
    # The core is built for arm64 only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TsyncPhone:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
      - path: ../../macos/Shared/Tsync.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync.phone
        PRODUCT_NAME: tsync
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: tsync
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: TsyncPhoneFileProvider
        embed: true

  # file-provider.md: the macOS extension's callbacks, with the owner in
  # process instead of behind a socket.
  TsyncPhoneFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: FileProvider
      - path: ../../macos/Shared/Tsync.swift
      - path: ../../macos/Shared/OwnerFailure.swift
      - path: ../../macos/TsyncFileProvider/TsyncExtension.swift
      - path: ../../macos/TsyncFileProvider/Enumerators.swift
      - path: ../../macos/TsyncFileProvider/OwnerReply.swift
      - path: ../../macos/TsyncFileProvider/Item.swift
      - path: ../../macos/TsyncFileProvider/Row.swift
      - path: ../../macos/TsyncFileProvider/Errors.swift
      - path: ../../macos/TsyncFileProvider/Cursors.swift
      - path: ../../macos/TsyncFileProvider/ChangeBatch.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.feverdreamtv.tsync.phone.fileprovider
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements
        INFOPLIST_FILE: FileProvider/Info.plist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
