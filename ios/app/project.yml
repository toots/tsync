# The iOS app and its File Provider extension. Generate with xcodegen on a Mac
# after ./build-core.sh has put the core's objects in core/. The identifiers
# (ios.md §3.1) come from the environment at generation: run-device.sh checks
# them.
name: TsyncPhone
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ${TSYNC_TEAM_ID}
    TSYNC_APP_GROUP: ${TSYNC_APP_GROUP}
    TSYNC_APP_ID: ${TSYNC_APP_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge.h
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../core $(SRCROOT)/../../lib/frontends/android/jni"
    # The core: the OCaml runtime and tsync as one object per SDK.
    "OTHER_LDFLAGS[sdk=iphoneos*]": "$(SRCROOT)/core/iphoneos/libtsyncios.o -framework Network -framework Security"
    "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(SRCROOT)/core/iphonesimulator/libtsyncios.o -framework Network -framework Security"
    # The core is built for arm64 only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TsyncPhone:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
        excludes: [Info.plist]
      - path: Client
      - path: ../../macos/Shared/Tsync.swift
      - path: ../../macos/Shared/OwnerFailure.swift
      - path: ../../macos/Shared/Base64URL.swift
      - path: ../../macos/TsyncApp/Reconciler.swift
      - path: ../../macos/TsyncApp/Identities.swift
      # vault §8.1: the glyph a vault without an icon is drawn with.
      - path: ../../macos/TsyncCredentials/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${TSYNC_APP_ID}
        PRODUCT_NAME: tsync
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # The commit About shows: run-device.sh passes TSYNC_COMMIT.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "tsync scans setup codes to join a domain, and codes to add to your vault."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "tsync checks it is you before it signs in with a passkey."
        INFOPLIST_KEY_CFBundleDisplayName: tsync
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: TsyncPhoneFileProvider
        embed: true
      - target: TsyncPhoneCredentials
        embed: true
      - target: TsyncPhoneShare
        embed: true

  # file-provider.md: the macOS extension's callbacks, with the owner in
  # process instead of behind a socket.
  TsyncPhoneFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: FileProvider
      - path: ../../macos/Shared/Tsync.swift
      - path: ../../macos/Shared/OwnerFailure.swift
      - path: ../../macos/TsyncFileProvider/TsyncExtension.swift
      - path: ../../macos/TsyncFileProvider/Enumerators.swift
      - path: ../../macos/TsyncFileProvider/OwnerReply.swift
      - path: ../../macos/TsyncFileProvider/Item.swift
      - path: ../../macos/TsyncFileProvider/Row.swift
      - path: ../../macos/TsyncFileProvider/Errors.swift
      - path: ../../macos/TsyncFileProvider/Cursors.swift
      - path: ../../macos/TsyncFileProvider/ChangeBatch.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${TSYNC_APP_ID}.fileprovider
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements
        # ios.md §3.1: development from a Mac, production for TestFlight.
        TSYNC_APS_ENVIRONMENT: ${TSYNC_APS_ENVIRONMENT}
        INFOPLIST_FILE: FileProvider/Info.plist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  # passwords/ios.md: the AutoFill credential provider, the macOS one's
  # requests drawn with UIKit, every request through the service (ios.md §5.4).
  TsyncPhoneCredentials:
    type: app-extension
    platform: iOS
    # passwords/ios §3: the passkey requests the shared controller answers.
    deploymentTarget: "17.0"
    sources:
      - path: Shared/Service.swift
      - path: Client
      - path: Credentials
        excludes: [Info.plist]
      - path: ../../macos/Shared/Tsync.swift
      - path: ../../macos/Shared/OwnerFailure.swift
      - path: ../../macos/Shared/Base64URL.swift
      - path: ../../macos/TsyncCredentials/CredentialProviderViewController.swift
      - path: ../../macos/TsyncCredentials/Requests.swift
      - path: ../../macos/TsyncCredentials/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${TSYNC_APP_ID}.credentials
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # It holds no core: every request goes through the service.
        "OTHER_LDFLAGS[sdk=iphoneos*]": ""
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        CODE_SIGN_ENTITLEMENTS: Credentials/Credentials.entitlements
        INFOPLIST_FILE: Credentials/Info.plist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  # ios-app.md §7: Save to tsync, writing through the file system.
  TsyncPhoneShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared/Service.swift
      - path: Client
      - path: Share
        excludes: [Info.plist]
      - path: App/FileStore.swift
      - path: ../../macos/Shared/Tsync.swift
      - path: ../../macos/Shared/OwnerFailure.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${TSYNC_APP_ID}.share
        # It holds no core: it writes through the file system.
        "OTHER_LDFLAGS[sdk=iphoneos*]": ""
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
        INFOPLIST_FILE: Share/Info.plist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
